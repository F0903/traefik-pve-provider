name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run tests with race detector
        run: go test -race ./...
      - name: Test plugin import and JSON serialization with Yaegi
        run: go test -tags yaegi -run '^TestYaegiImportsPlugin$' -count=1 ./...
